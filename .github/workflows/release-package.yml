# Builds the package and attaches the `npm pack` tarball to a GitHub release,
# so consumers (e.g. the Graduate College handbook) can depend on a prebuilt
# https URL instead of building from git.
name: Release package

on:
  push:
    tags:
      - "handbook-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. handbook-v1.5.5)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prepack runs `npm run build`.
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --verify-tag --title "$TAG" \
              --notes "Install with: \`npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}\`"
          fi
